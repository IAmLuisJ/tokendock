name: TokenDock
description: >-
  Start TokenDock, a fake OAuth 2.0 Authorization Server for CI. Issues
  RS256-signed JWTs (RFC 9068 at+jwt by default) via the client credentials
  grant, with JWKS and OIDC discovery endpoints for the app under test to
  validate them.
branding:
  icon: anchor
  color: blue

inputs:
  image:
    description: TokenDock Docker image to run
    default: ghcr.io/iamluisj/tokendock:latest
  port:
    description: Host port to expose the server on
    default: "8080"
  issuer:
    description: Issuer URL embedded in tokens (must match how the app under test reaches the server)
    default: ""
  client-id:
    description: Client ID allowed to request tokens (omit to use the built-in demo client)
    default: ""
  client-secret:
    description: Client secret for client-id (omit to accept any secret, so the real one never enters CI)
    default: ""
  scopes:
    description: Comma-separated scopes the client may request (empty allows any scope)
    default: ""
  audience:
    description: aud claim for issued tokens
    default: ""
  clients:
    description: Inline YAML/JSON list of clients (sets TOKENDOCK_CLIENTS) — use for multiple clients without a config file
    default: ""
  config-file:
    description: Path to a TokenDock YAML config file (overrides the clients and client-* inputs)
    default: ""
  rfc9068:
    description: >-
      Issue access tokens with the RFC 9068 "at+jwt" typ header. Default true.
      Set to false for validators that only accept typ "JWT" (e.g. Spring
      Security 7 / Spring Boot 4 defaults).
    default: ""

outputs:
  issuer:
    description: Issuer URL of the running server
    value: ${{ steps.start.outputs.issuer }}
  token-endpoint:
    description: OAuth token endpoint URL
    value: ${{ steps.start.outputs.token-endpoint }}
  jwks-uri:
    description: JWKS URL for validating issued tokens
    value: ${{ steps.start.outputs.jwks-uri }}

runs:
  using: composite
  steps:
    - id: start
      shell: bash
      # Inputs arrive via env, never as expressions inside the script: interpolated
      # text is parsed as shell, so quotes, $(...) or $$ in a value would
      # break the command or run code.
      env:
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_ISSUER: ${{ inputs.issuer }}
        INPUT_CLIENT_ID: ${{ inputs.client-id }}
        INPUT_CLIENT_SECRET: ${{ inputs.client-secret }}
        INPUT_SCOPES: ${{ inputs.scopes }}
        INPUT_AUDIENCE: ${{ inputs.audience }}
        INPUT_CLIENTS: ${{ inputs.clients }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_RFC9068: ${{ inputs.rfc9068 }}
      run: |
        set -euo pipefail

        port="$INPUT_PORT"
        issuer="$INPUT_ISSUER"
        if [ -z "$issuer" ]; then
          issuer="http://localhost:${port}"
        fi
        # The issuer is written to $GITHUB_OUTPUT; a newline would forge
        # additional outputs.
        if [[ "$issuer" == *$'\n'* || "$issuer" == *$'\r'* ]]; then
          echo "issuer must be a single line" >&2
          exit 1
        fi

        args=(-d --name tokendock -p "${port}:${port}"
              -e "TOKENDOCK_PORT=${port}"
              -e "TOKENDOCK_ISSUER=${issuer}")

        if [ -n "$INPUT_RFC9068" ]; then
          args+=(-e "TOKENDOCK_RFC9068=${INPUT_RFC9068}")
        fi

        if [ -n "$INPUT_CONFIG_FILE" ]; then
          args+=(-v "$(realpath -- "$INPUT_CONFIG_FILE"):/etc/tokendock/config.yaml:ro")
        else
          if [ -n "$INPUT_CLIENTS" ]; then
            args+=(-e "TOKENDOCK_CLIENTS=${INPUT_CLIENTS}")
          fi
          if [ -n "$INPUT_CLIENT_ID" ]; then
            args+=(-e "TOKENDOCK_CLIENT_ID=${INPUT_CLIENT_ID}"
                   -e "TOKENDOCK_CLIENT_SECRET=${INPUT_CLIENT_SECRET}")
            [ -n "$INPUT_SCOPES" ]   && args+=(-e "TOKENDOCK_SCOPES=${INPUT_SCOPES}")
            [ -n "$INPUT_AUDIENCE" ] && args+=(-e "TOKENDOCK_AUDIENCE=${INPUT_AUDIENCE}")
          fi
        fi

        docker run "${args[@]}" "$INPUT_IMAGE"

        echo "Waiting for TokenDock to become healthy..."
        for i in $(seq 1 30); do
          if curl -sf "http://localhost:${port}/health" > /dev/null; then
            echo "TokenDock is ready at ${issuer}"
            {
              echo "issuer=${issuer}"
              echo "token-endpoint=${issuer}/token"
              echo "jwks-uri=${issuer}/.well-known/jwks.json"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 1
        done

        echo "TokenDock did not become healthy in time; container logs:" >&2
        docker logs tokendock >&2 || true
        exit 1
