name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  dogfood-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build local image
        run: docker build -t tokendock:ci .

      - name: Start TokenDock via the composite action
        id: tokendock
        uses: ./action
        with:
          image: tokendock:ci
          client-id: ci-client
          client-secret: ci-secret
          scopes: read,write
          audience: my-api

      - name: Fetch and inspect a token
        run: |
          set -euo pipefail
          resp=$(curl -sf -u ci-client:ci-secret \
            -d grant_type=client_credentials -d 'scope=read write' \
            "${{ steps.tokendock.outputs.token-endpoint }}")
          echo "$resp" | jq -e '.token_type == "Bearer"'
          token=$(echo "$resp" | jq -r .access_token)

          payload=$(echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          echo "$payload" | jq -e --arg iss "${{ steps.tokendock.outputs.issuer }}" '.iss == $iss'
          echo "$payload" | jq -e '.aud == "my-api" and .scope == "read write"'

          kid=$(echo "$token" | cut -d. -f1 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r .kid || true)
          curl -sf "${{ steps.tokendock.outputs.jwks-uri }}" | jq -e --arg kid "$kid" '.keys[] | select(.kid == $kid)'

      - name: Run the authorization code flow with PKCE
        run: |
          set -euo pipefail
          b64url_decode() {
            local s
            s=$(printf '%s' "$1" | tr '_-' '/+')
            case $(( ${#s} % 4 )) in 2) s="$s==" ;; 3) s="$s=" ;; esac
            printf '%s' "$s" | base64 -d
          }

          verifier=$(openssl rand -hex 32)
          challenge=$(printf '%s' "$verifier" | openssl dgst -sha256 -binary | base64 | tr '+/' '-_' | tr -d '=')
          redirect_uri=http://localhost:3000/callback

          # A browser would follow this redirect; curl only reports it.
          location=$(curl -s -o /dev/null -w '%{redirect_url}' -G \
            --data-urlencode response_type=code \
            --data-urlencode client_id=ci-client \
            --data-urlencode "redirect_uri=${redirect_uri}" \
            --data-urlencode 'scope=openid read' \
            --data-urlencode state=dogfood \
            --data-urlencode nonce=n-0S6 \
            --data-urlencode login_hint=alice \
            --data-urlencode "code_challenge=${challenge}" \
            --data-urlencode code_challenge_method=S256 \
            "${{ steps.tokendock.outputs.authorization-endpoint }}")
          echo "redirected to: ${location}"
          case "$location" in "${redirect_uri}?"*) ;; *) echo "unexpected redirect" >&2; exit 1 ;; esac
          code=$(printf '%s' "$location" | sed -n 's/.*[?&]code=\([^&]*\).*/\1/p')
          test -n "$code"

          resp=$(curl -sf -u ci-client:ci-secret \
            -d grant_type=authorization_code \
            --data-urlencode "code=${code}" \
            --data-urlencode "redirect_uri=${redirect_uri}" \
            --data-urlencode "code_verifier=${verifier}" \
            "${{ steps.tokendock.outputs.token-endpoint }}")
          echo "$resp" | jq -e '.token_type == "Bearer" and .scope == "openid read"'

          b64url_decode "$(echo "$resp" | jq -r .access_token | cut -d. -f2)" \
            | jq -e '.sub == "alice" and .aud == "my-api"'
          id_token=$(echo "$resp" | jq -r .id_token)
          b64url_decode "$(echo "$id_token" | cut -d. -f1)" | jq -e '.typ == "JWT"'
          b64url_decode "$(echo "$id_token" | cut -d. -f2)" | jq -e \
            --arg iss "${{ steps.tokendock.outputs.issuer }}" \
            '.iss == $iss and .sub == "alice" and .aud == "ci-client" and .nonce == "n-0S6"'

      - name: Run the JWT bearer grant with a client assertion
        run: |
          set -euo pipefail
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          b64url_decode() {
            local s
            s=$(printf '%s' "$1" | tr '_-' '/+')
            case $(( ${#s} % 4 )) in 2) s="$s==" ;; 3) s="$s=" ;; esac
            printf '%s' "$s" | base64 -d
          }
          # An HS256 JWT signed with a key TokenDock never sees: it parses
          # assertions without verifying their signatures.
          jwt() {
            local header payload sig
            header=$(printf '%s' '{"alg":"HS256","typ":"JWT"}' | b64url)
            payload=$(printf '%s' "$1" | b64url)
            sig=$(printf '%s' "${header}.${payload}" | openssl dgst -sha256 -hmac not-shared-with-tokendock -binary | b64url)
            printf '%s.%s.%s' "$header" "$payload" "$sig"
          }

          token_endpoint="${{ steps.tokendock.outputs.token-endpoint }}"
          curl -sf "${{ steps.tokendock.outputs.issuer }}/.well-known/openid-configuration" | jq -e \
            '(.grant_types_supported | index("urn:ietf:params:oauth:grant-type:jwt-bearer")) and
             (.token_endpoint_auth_methods_supported | index("private_key_jwt"))'

          assertion=$(jwt '{"iss":"https://upstream-idp.example","sub":"alice","roles":["reader"]}')
          client_assertion=$(jwt "$(jq -cn --arg aud "$token_endpoint" --argjson exp "$(( $(date +%s) + 300 ))" \
            '{iss: "ci-client", sub: "ci-client", aud: $aud, exp: $exp}')")

          # No -u: the client authenticates with its assertion, not ci-secret.
          resp=$(curl -sf \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
            --data-urlencode "assertion=${assertion}" \
            -d client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
            --data-urlencode "client_assertion=${client_assertion}" \
            -d scope=read \
            "$token_endpoint")
          echo "$resp" | jq -e '.token_type == "Bearer" and .scope == "read"'
          b64url_decode "$(echo "$resp" | jq -r .access_token | cut -d. -f2)" \
            | jq -e '.sub == "alice" and .aud == "my-api" and .roles == ["reader"]'
