<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · TokenDock</title>
<style>
  :root {
    color-scheme: light dark;
    --paper: oklch(95.5% 0.018 85);
    --ink: oklch(27% 0.045 255);
    --muted: oklch(42% 0.03 255);
    --rule: oklch(80% 0.05 78);
    --rust: oklch(52% 0.17 32);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: oklch(21% 0.03 255);
      --ink: oklch(93% 0.02 85);
      --muted: oklch(74% 0.03 255);
      --rule: oklch(38% 0.04 255);
      --rust: oklch(72% 0.14 32);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--paper); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: 100%; max-width: 26rem; border: 2px solid var(--ink); padding: 1.75rem 1.5rem; }
  .flag {
    margin: 0 0 .5rem; color: var(--rust);
    font: 600 .75rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .12em; text-transform: uppercase;
  }
  h1 { margin: 0 0 1.25rem; font-size: 1.5rem; line-height: 1.2; overflow-wrap: anywhere; }
  label { display: block; font-weight: 600; margin-bottom: .35rem; }
  input {
    width: 100%; font: inherit; padding: .6rem .7rem;
    border: 1px solid var(--ink); background: transparent; color: inherit;
  }
  .hint { margin: .4rem 0 1.25rem; font-size: .875rem; color: var(--muted); }
  button {
    width: 100%; font: inherit; font-weight: 600; padding: .7rem; border: 0;
    background: var(--ink); color: var(--paper); cursor: pointer;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--rust); outline-offset: 2px; }
  dl {
    margin: 1.5rem 0 0; padding-top: 1rem; border-top: 1px solid var(--rule);
    display: grid; grid-template-columns: auto 1fr; gap: .25rem .75rem; font-size: .8125rem;
  }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <p class="flag">TokenDock · test double</p>
  <h1>Sign in to {{client_id}}</h1>
  <form method="post" action="login">{{hidden_fields}}
    <label for="login_hint">Subject</label>
    <input id="login_hint" name="login_hint" value="{{subject}}" required autofocus autocomplete="username">
    <p class="hint">Becomes the <code>sub</code> claim. There is no password: any subject signs in.</p>
    <button type="submit">Sign in</button>
  </form>
  <dl>
    <dt>Scopes</dt><dd>{{scopes}}</dd>
    <dt>Redirect</dt><dd>{{redirect_uri}}</dd>
  </dl>
</main>
</body>
</html>
